name: Tests

on:
  push:
    branches: [master, x-protocol]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test dependencies
        run: pip install -e ".[test]"

      - name: Run unit tests (no Magma required)
        run: pytest tests/test_protocol.py tests/test_lexer.py -v -k 'not TestMagmaProcess'

  lexer-regex-fallback:
    name: Lexer tests (regex fallback, no tree-sitter)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install without tree-sitter
        run: |
          pip install pygments ipykernel jupyter_client pytest pytest-cov
          pip install -e . --no-deps

      - name: Verify regex fallback is active
        run: python -c "from magma_kernel.lexer import _HAS_TREE_SITTER; assert not _HAS_TREE_SITTER"

      - name: Run lexer tests with regex backend
        run: pytest tests/test_lexer.py -v

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with test dependencies
        run: pip install -e ".[test]"

      # Tests that require Magma auto-skip via @pytest.mark.skipif
      # when `magma` is not on PATH. Once Magma is available on the
      # runner, they will run automatically — no workflow changes needed.
      - name: Run all tests
        run: pytest tests/ -v
